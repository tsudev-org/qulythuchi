version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups: { actions: { patterns: ['*'] } }
  - package-ecosystem: pub
    directory: /packages/core
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups: { pub: { patterns: ['*'] } }
  - package-ecosystem: pub
    directory: /apps/app
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups: { pub-app: { patterns: ['*'] } }
  - package-ecosystem: npm
    directory: /services/sync-api
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups: { npm-sync-api: { patterns: ['*'] } }
# Thêm npm cho apps/site ở P8.
