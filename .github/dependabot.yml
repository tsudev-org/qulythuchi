version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups: { actions: { patterns: ['*'] } }
  - package-ecosystem: pub
    directory: /packages/core
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups: { pub: { patterns: ['*'] } }
# Thêm pub (apps/app) ở P2 và npm (services/sync-api, apps/site) ở P5/P8.
