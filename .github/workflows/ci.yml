# Cổng kiểm cho mọi PR và main. Action ghim SHA; công cụ tải ngoài ghim phiên bản + checksum.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.50.1'
  FLUTTER_COMMIT: 'ae9b586f34a8443573f82ef57c3bf914a908cbf7'

jobs:
  standards:
    name: Quy ước tsudev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: ./scripts/check-standards.sh
      - run: ./scripts/sync-standards.sh --check
      # PROJECT_STRUCTURE.md mục 3.1: import/biến thừa trong script Python (ruff ghim kèm băm).
      - name: Mã thừa Python (ruff F401, F841)
        run: |
          set -euo pipefail
          python3 -m pip install --user --require-hashes -r scripts/requirements-lint.txt
          python3 -m ruff check --select F401,F841 conformance services/sync-api/scripts scripts

  gitleaks:
    name: Quét lộ bí mật (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks-action đòi license khi repo thuộc Organization ⇒ binary ghim phiên bản + checksum.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  core:
    name: Lõi Dart (packages/core)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Flutter/Dart (ghim commit)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Phân tích, định dạng, test + độ phủ
        working-directory: packages/core
        run: |
          set -euo pipefail
          dart pub get
          dart format --output=none --set-exit-if-changed lib test tool
          dart analyze --fatal-infos
          dart test --coverage=coverage
      - name: Vector đối chiếu khớp mã nguồn
        working-directory: packages/core
        run: |
          dart run tool/gen_vectors.dart > "$RUNNER_TEMP/envelope-v1.json"
          diff -u ../../conformance/envelope-v1.json "$RUNNER_TEMP/envelope-v1.json" || { echo "conformance/envelope-v1.json cũ hoặc lõi đổi định dạng - sinh lại + tăng phiên bản"; exit 1; }
      - name: Kiểm vector bằng libsodium độc lập của hệ điều hành
        run: |
          sudo apt-get install -yq libsodium23 >/dev/null
          python3 -I conformance/verify_libsodium.py conformance/envelope-v1.json packages/core/lib/src/crypto/bip39_english.dart

  app:
    name: App Flutter (apps/app)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Flutter/Dart (ghim commit)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Gói hệ thống cho build Linux (GTK, libsecret)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev >/dev/null
      - name: Sinh mã khớp nguồn (l10n, token thiết kế)
        working-directory: apps/app
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run tool/gen_tokens.dart
          dart format lib/theme/tokens.g.dart lib/l10n >/dev/null
          git diff --exit-code -- lib/l10n lib/theme || { echo "Tệp sinh ra đã cũ - chạy flutter gen-l10n / dart run tool/gen_tokens.dart"; exit 1; }
      - name: Định dạng, phân tích, test
        working-directory: apps/app
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze --fatal-infos
          flutter test
      - name: Build Linux
        working-directory: apps/app
        run: flutter build linux --release
      - name: Build web (tài nguyên tự phục vụ, checksum ghim)
        working-directory: apps/app
        run: |
          ./tool/fetch_web_assets.sh
          flutter build web --release --base-href /app/ --csp --no-web-resources-cdn
      - name: Cây làm việc sạch sau build (PROJECT_STRUCTURE.md mục 3.1)
        run: |
          dirty="$(git status --porcelain)"
          [ -z "$dirty" ] || { echo "::error::Build sinh tệp chưa được .gitignore/commit:"; echo "$dirty"; exit 1; }

  desktop-ocr:
    # ADR-0021: chạy engine OCR THẬT của từng desktop (Windows.Media.Ocr, Vision, Tesseract hệ thống) qua
    # integration_test - đồng thời là lần dựng debug Windows/macOS ở PR (mã native trong runner).
    name: OCR desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux }
          - { os: windows-2025, target: windows }
          - { os: macos-15, target: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Flutter/Dart (ghim commit)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Gói hệ thống Linux (GTK, Tesseract tiếng Việt, màn hình ảo)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev \
            tesseract-ocr tesseract-ocr-vie xvfb gnome-keyring dbus >/dev/null
      - name: Ngôn ngữ OCR có trên máy (ghi vào ADR-0021)
        run: |
          case "${{ matrix.target }}" in
            linux) tesseract --list-langs ;;
            windows) powershell -NoProfile -Command "[Windows.Media.Ocr.OcrEngine,Windows.Foundation,ContentType=WindowsRuntime] > \$null; [Windows.Media.Ocr.OcrEngine]::AvailableRecognizerLanguages | ForEach-Object LanguageTag" || true ;;
            macos)
              sw_vers
              printf '%s\n' 'import Vision' 'let r = VNRecognizeTextRequest()' 'r.recognitionLevel = .accurate' \
                'print(try r.supportedRecognitionLanguages())' | swift - || true ;;
          esac
      - name: OCR thật trên hóa đơn vẽ sẵn
        working-directory: apps/app
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          if [ "${{ matrix.target }}" = linux ]; then
            xvfb-run -a flutter test integration_test/desktop_ocr_test.dart -d linux
          else
            flutter test integration_test/desktop_ocr_test.dart -d ${{ matrix.target }}
          fi
      - name: Đo khởi động bản release tới khung hình đầu tiên (LANGUAGE_SELECTION 5.1, ≤ 1 giây)
        # Không chặn: chỉ đo và ghi vào tóm tắt job (AGENTS.md B.4). Linux cần Secret Service ⇒ gnome-keyring trong
        # phiên D-Bus riêng (app lưu khóa CSDL ở kho bí mật của hệ điều hành).
        working-directory: apps/app
        run: |
          set -euo pipefail
          flutter build ${{ matrix.target }} --release
          case "${{ matrix.target }}" in
            linux)
              dbus-run-session -- sh -c 'echo -n qt | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets >/dev/null &&
                xvfb-run -a python3 -I tool/do_khoi_dong.py "$0"' build/linux/x64/release/bundle/qulythuchi ;;
            windows) python -I tool/do_khoi_dong.py build/windows/x64/runner/Release/qulythuchi.exe ;;
            macos) python3 -I tool/do_khoi_dong.py "build/macos/Build/Products/Release/Quly Thu Chi.app/Contents/MacOS/Quly Thu Chi" ;;
          esac

  android:
    # Dựng APK release (ký khoá debug - chỉ kiểm dựng, KHÔNG phát hành) để lỗi Gradle/AAR metadata/compileSdk lộ ra ở PR
    # thay vì lúc cắt thẻ (bài học v26.11.2302-beta.1).
    name: Android (apps/app)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Flutter/Dart (ghim commit)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build APK release (khoá debug, không phát hành)
        working-directory: apps/app
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          flutter build apk --release --dart-define=TSU_CHANNEL=direct

  server:
    name: Máy chủ (services/sync-api)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: services/sync-api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Cài phụ thuộc đúng lockfile (npm ghim phiên bản)
        run: npx -y npm@11.21.2 ci --no-fund --no-audit
      - name: Kiểm lỗ hổng phụ thuộc
        run: node scripts/audit.mjs
      - name: Typecheck, lint, test (D1/R2 giả lập cục bộ, không cần token)
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm test
      - name: Mã chết / export / phụ thuộc thừa (knip - PROJECT_STRUCTURE 3.1)
        run: npm run knip
      - name: Build Worker (dry-run)
        run: |
          # Thư mục tĩnh thật do job Website dựng; dry-run chỉ cần thư mục tồn tại.
          mkdir -p ../../apps/site/dist
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

  site:
    name: Website (apps/site)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults: { run: { working-directory: apps/site } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Cài phụ thuộc đúng lockfile (npm ghim phiên bản)
        run: npx -y npm@11.21.2 ci --no-fund --no-audit
      - name: Tài sản nhận diện bắt buộc (BRAND_ASSETS.md mục 12.2)
        run: |
          set -e
          for f in favicon.ico favicon-96x96.png apple-touch-icon.png og-image.png; do
            test -f "public/$f" || { echo "Thiếu tài sản bắt buộc: $f"; exit 1; }
          done
      - name: Build (tài sản khớp nguồn, trang tĩnh, kiểm dist) + typecheck
        run: |
          set -euo pipefail
          npm run build
          npm run typecheck
      - name: Mã chết / export / phụ thuộc thừa (knip - PROJECT_STRUCTURE 3.1)
        run: npm run knip
