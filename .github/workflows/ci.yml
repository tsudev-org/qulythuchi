# Cổng kiểm cho mọi PR và main. Action ghim SHA; công cụ tải ngoài ghim phiên bản + checksum.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.47.8'
  FLUTTER_COMMIT: '737ba8f885dc774b53b442759999a312c9461e4e'

jobs:
  standards:
    name: Quy ước tsudev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: ./scripts/check-standards.sh
      - run: ./scripts/sync-standards.sh --check

  gitleaks:
    name: Quét lộ bí mật (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks-action đòi license khi repo thuộc Organization ⇒ binary ghim phiên bản + checksum.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  core:
    name: Lõi Dart (packages/core)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Flutter/Dart (ghim commit)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Phân tích, định dạng, test + độ phủ
        working-directory: packages/core
        run: |
          set -euo pipefail
          dart pub get
          dart format --output=none --set-exit-if-changed lib test tool
          dart analyze --fatal-infos
          dart test --coverage=coverage
      - name: Vector đối chiếu khớp mã nguồn
        working-directory: packages/core
        run: |
          dart run tool/gen_vectors.dart > "$RUNNER_TEMP/envelope-v1.json"
          diff -u ../../conformance/envelope-v1.json "$RUNNER_TEMP/envelope-v1.json" || { echo "conformance/envelope-v1.json cũ hoặc lõi đổi định dạng - sinh lại + tăng phiên bản"; exit 1; }
      - name: Kiểm vector bằng libsodium độc lập của hệ điều hành
        run: |
          sudo apt-get install -yq libsodium23 >/dev/null
          python3 -I conformance/verify_libsodium.py conformance/envelope-v1.json packages/core/lib/src/crypto/bip39_english.dart

  app:
    name: App Flutter (apps/app)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Flutter/Dart (ghim commit)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Gói hệ thống cho build Linux (GTK, libsecret)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev >/dev/null
      - name: Sinh mã khớp nguồn (l10n, token thiết kế)
        working-directory: apps/app
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run tool/gen_tokens.dart
          dart format lib/theme/tokens.g.dart lib/l10n >/dev/null
          git diff --exit-code -- lib/l10n lib/theme || { echo "Tệp sinh ra đã cũ - chạy flutter gen-l10n / dart run tool/gen_tokens.dart"; exit 1; }
      - name: Định dạng, phân tích, test
        working-directory: apps/app
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze --fatal-infos
          flutter test
      - name: Build Linux
        working-directory: apps/app
        run: flutter build linux --release
      - name: Build web (tài nguyên tự phục vụ, checksum ghim)
        working-directory: apps/app
        run: |
          ./tool/fetch_web_assets.sh
          flutter build web --release

  server:
    name: Máy chủ (services/sync-api)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: services/sync-api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Cài phụ thuộc đúng lockfile (npm ghim phiên bản)
        run: npx -y npm@11.21.2 ci --no-fund --no-audit
      - name: Kiểm lỗ hổng phụ thuộc
        run: node scripts/audit.mjs
      - name: Typecheck, lint, test (D1/R2 giả lập cục bộ, không cần token)
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm test
      - name: Build Worker (dry-run)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
